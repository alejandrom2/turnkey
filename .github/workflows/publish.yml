name: Publish

# Every v* tag becomes a GitHub Release with its changelog section and the packed plugin.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.9.1
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$TAG" || { echo "Tag $TAG doesn't match package.json $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx streamdeck pack com.alejandrom2.turnkey.sdPlugin --output dist --version "$VERSION.0" --no-update-check
      - name: Release notes from the changelog
        run: awk -v v="$VERSION" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1 || index($0, "## [" v "]") == 1) { found=1; next } } found' CHANGELOG.md > notes.md
      - name: Create the release
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.streamDeckPlugin --clobber
          else
            gh release create "$TAG" dist/*.streamDeckPlugin --title "Turnkey for T3 Code $VERSION" --notes-file notes.md --verify-tag $prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}
