name: Publish

# Every v* tag becomes a GitHub Release with its changelog section and the packed plugin.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.9.1
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$TAG" || { echo "Tag $TAG doesn't match package.json $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run assets
      - name: Generated files are committed
        run: test -z "$(git status --porcelain)" || { git status; echo "::error::The tag's generated files are stale."; exit 1; }
      - run: npm run build
      - run: npx streamdeck validate com.alejandrom2.turnkey.sdPlugin
      - run: npx streamdeck pack com.alejandrom2.turnkey.sdPlugin --output dist --version "$VERSION.0" --no-update-check
      # A fixed name, so the README can link releases/latest/download/Turnkey.streamDeckPlugin.
      - run: mv dist/com.alejandrom2.turnkey.streamDeckPlugin dist/Turnkey.streamDeckPlugin
      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1 || index($0, "## [" v "]") == 1) { found=1; next } } found' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no notes for $VERSION."; exit 1; }
      - name: Create the release
        run: |
          prerelease=""
          # Only suffixed versions (0.12.0-beta) are pre-releases: GitHub's "latest" skips those.
          case "$VERSION" in *-*) prerelease="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Turnkey.streamDeckPlugin --clobber
          else
            gh release create "$TAG" dist/Turnkey.streamDeckPlugin --title "Turnkey $VERSION" --notes-file notes.md --verify-tag $prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  logi:
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: dotnet tool install --global LogiPluginTool
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: npm run logi:pack
      - run: gh release upload "$TAG" logi/dist/Turnkey.lplug4 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
