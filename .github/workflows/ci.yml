name: CI

# Pushes to main run this through release.yml, so a version is only tagged on a commit that passed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/commits.ts ${{ github.event.before }}..${{ github.sha }}
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: node scripts/commits.ts origin/${{ github.base_ref }}..HEAD
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # Generated inspectors, icons, profiles and the manifest version must be committed as `npm run assets` writes them.
      - run: npm run assets
      - name: Generated files are committed
        run: test -z "$(git status --porcelain)" || { git status; echo "::error::Run npm run assets and commit its changes."; exit 1; }
      - run: npm run build
      - run: npx streamdeck validate com.alejandrom2.turnkey.sdPlugin

  logi:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: dotnet tool install --global LogiPluginTool
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: npm run logi:pack
