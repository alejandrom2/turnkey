name: Release

# release-please keeps the release PR (version and changelog); merging it tags the version, and the tag publishes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Tagging and the GitHub Release belong to the tag job and publish.yml.
          skip-github-release: true

  # release-please bumps package.json; the manifest's four-part version and the pages showing it follow on the release PR.
  sync-version:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run assets
      # Profile zips come out slightly different on Linux; the committed ones stay.
      - run: git checkout -- '*.streamDeckProfile'
      - name: Commit the version
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: version for the release"
          git push

  # A merged release PR leaves package.json at a version with no tag yet: tag it, then publish that tag.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: version
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Tag the version
        id: tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Turnkey for T3 Code ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "created=true" >> "$GITHUB_OUTPUT"
      # A tag pushed with the workflow token starts no other workflow, so ask for the publish run directly.
      - name: Publish the tag
        if: steps.tag.outputs.created == 'true'
        run: gh workflow run publish.yml -f tag=${{ steps.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
      # release-please waits on PRs marked pending; mark the merged one released.
      - name: Mark the release PR tagged
        if: steps.tag.outputs.created == 'true'
        run: |
          gh label create "autorelease: tagged" --color ededed --force >/dev/null
          for pr in $(gh pr list --state merged --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr edit "$pr" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done
        env:
          GH_TOKEN: ${{ github.token }}
