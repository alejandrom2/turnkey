version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Minor and patch updates together; a major version comes in a PR of its own, to check by hand.
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The plugin runs on Stream Deck's Node 24.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
